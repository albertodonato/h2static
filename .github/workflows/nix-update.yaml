name: Nix update

on:
  push:
    branches:
      - main
    paths:
      - go.mod
      - go.sum
      - nix/package.nix
  workflow_dispatch:

jobs:
  vendor-hash:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Repository checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Refresh vendorHash
        run: nix run nixpkgs#nix-update -- --flake --version=skip h2static

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: nix-update/vendor-hash
          title: "chore: refresh Nix vendorHash"
          commit-message: "chore: refresh Nix vendorHash"
          body: |
            `go.mod`/`go.sum` changed, so `vendorHash` in `nix/package.nix` was
            refreshed by `nix-update`.
          delete-branch: true
